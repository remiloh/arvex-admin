<title>ARVEX · Журнал записей</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #FFFFF0;
    --bg: #000;
    --card: rgba(12,12,12,0.85);
    --border: #1c1c1c;
    --text: #e8e8e8;
    --muted: #7a7a7a;
    --new: #f5c451;
    --ok: #7ad19b;
    --done: #8aa3ff;
    --bad: #e07a7a;
  }
  html { -webkit-text-size-adjust: 100%; background: #000; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.45;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 600px at 90% -10%, rgba(255,255,240,0.08), transparent 65%),
      radial-gradient(500px 500px at -10% 60%, rgba(255,255,240,0.05), transparent 65%);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  .hidden { display: none !important; }

  /* ===== ВХОД ===== */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 360px; text-align: center; }
  .login-box img { width: 220px; max-width: 70%; margin-bottom: 24px; filter: drop-shadow(0 0 18px rgba(255,255,240,0.2)); }
  .login-box h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-box form { display: flex; flex-direction: column; gap: 12px; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; }

  /* ===== ПОЛЯ И КНОПКИ ===== */
  .inp {
    width: 100%; min-width: 0;
    background: rgba(10,10,10,0.8); border: 1px solid var(--border);
    border-radius: 10px; padding: 13px 14px; font-size: 16px;
    color-scheme: dark; transition: border-color .2s;
  }
  .inp:focus { outline: none; border-color: var(--accent); }
  textarea.inp { resize: vertical; min-height: 70px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #000; border: none;
    border-radius: 10px; padding: 13px 18px; font-weight: 700; font-size: 15px;
    transition: transform .15s, opacity .2s; text-decoration: none;
  }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .5; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid #333; }
  .btn-danger { background: transparent; color: var(--bad); border: 1px solid #4a2a2a; }
  .btn-sm { padding: 9px 12px; font-size: 14px; border-radius: 9px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(10,10,10,0.8); color: var(--accent); font-size: 18px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ===== ШАПКА ===== */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(0,0,0,0.85); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  }
  .top-row { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .top-row img { height: 38px; width: auto; }
  .top-title { flex: 1; min-width: 0; }
  .top-title b { display: block; font-size: 16px; }
  .top-title span { font-size: 12px; color: var(--muted); }
  .tabs { max-width: 960px; margin: 10px auto 0; display: flex; gap: 6px; }
  .tab {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-weight: 600; font-size: 15px;
    position: relative;
  }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .badge {
    display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 6px;
    border-radius: 10px; background: var(--new); color: #000; font-size: 12px; font-weight: 800;
  }

  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 120px; }

  /* ===== ЛЕНТА ДНЕЙ ===== */
  .days {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    padding: 2px 2px 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
    scroll-snap-type: x proximity;
  }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: 0 0 58px; padding: 8px 0 10px; border-radius: 12px; text-align: center;
    border: 1px solid var(--border); background: var(--card); scroll-snap-align: center;
    position: relative;
  }
  .day small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .day b { display: block; font-size: 20px; line-height: 1.2; }
  .day i { font-style: normal; font-size: 10px; color: var(--muted); }
  .day.today { border-color: #444; }
  .day.active { background: var(--accent); border-color: var(--accent); color: #000; }
  .day.active small, .day.active i { color: #333; }
  .day .dot { position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .day .dot.n { background: var(--new); }
  .day.active .dot { background: #000; }

  .day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 14px 0 12px; }
  .day-head h2 { font-size: 22px; font-weight: 800; }
  .day-head p { color: var(--muted); font-size: 14px; }
  .day-head .inp { width: auto; padding: 8px 10px; font-size: 14px; }

  /* ===== СТРОКИ РАСПИСАНИЯ ===== */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    cursor: pointer;
    display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: start;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; text-align: left; width: 100%;
    border-left: 3px solid var(--ok);
  }
  .row.s-new { border-left-color: var(--new); border-style: dashed solid dashed solid; }
  .row.s-done { border-left-color: var(--done); opacity: .75; }
  .row-time { font-size: 20px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .row-time small { display: block; font-size: 11px; font-weight: 600; margin-top: 4px; }
  .row-main b { display: block; font-size: 16px; }
  .row-main .svc { font-size: 14px; color: var(--text); }
  .row-main .sub { font-size: 13px; color: var(--muted); }
  .row-main .tel { display: inline-block; margin-top: 6px; font-size: 14px; color: var(--accent); text-decoration: none; border-bottom: 1px dashed #555; }
  .row-price { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .st { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
  .st-new { color: var(--new); } .st-ok { color: var(--ok); } .st-done { color: var(--done); } .st-bad { color: var(--bad); }

  /* ===== ЗАЯВКИ ===== */
  .req {
    background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--new);
    border-radius: 14px; padding: 16px;
  }
  .req-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .req-top b { font-size: 17px; }
  .req-top span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .req-when { margin: 8px 0 6px; font-size: 15px; }
  .req-when b { color: var(--accent); }
  .req .sub { font-size: 14px; color: var(--muted); }
  .req .comment { margin-top: 8px; font-size: 14px; padding: 10px 12px; background: rgba(255,255,240,0.03); border-radius: 10px; white-space: pre-line; }
  .req-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .req-actions .grow { flex: 1 1 140px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed #222; border-radius: 14px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  .section-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }

  /* ===== КНОПКА + ===== */
  .fab {
    position: fixed; right: 18px; bottom: max(18px, env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%; border: none;
    background: var(--accent); color: #000; font-size: 30px; line-height: 1;
    box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 24px rgba(255,255,240,.15); z-index: 30;
  }

  /* ===== РЕДАКТОР (нижний лист) ===== */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    background: #0a0a0a; border: 1px solid var(--border); border-bottom: none;
    border-radius: 20px 20px 0 0; padding: 18px 16px; padding-bottom: max(18px, env(safe-area-inset-bottom));
    animation: up .25s ease;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h3 { font-size: 19px; }
  .fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; min-width: 0; }
  .fld label { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button { padding: 10px 4px; border-radius: 9px; border: 1px solid var(--border); background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on[data-s="Новая"] { border-color: var(--new); color: var(--new); }
  .seg button.on[data-s="Подтверждена"] { border-color: var(--ok); color: var(--ok); }
  .seg button.on[data-s="Выполнена"] { border-color: var(--done); color: var(--done); }
  .seg button.on[data-s="Отменена"] { border-color: var(--bad); color: var(--bad); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
  .sheet-actions .btn:first-child { flex: 1; }
  .warn { background: rgba(245,196,81,.08); border: 1px solid rgba(245,196,81,.4); color: var(--new); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .contact { display: flex; gap: 8px; margin: -4px 0 12px; }
  .contact a { flex: 1; text-align: center; text-decoration: none; }

  /* ===== УВЕДОМЛЕНИЕ ===== */
  .toast {
    position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translate(-50%, calc(-100% - 40px));
    background: #111; border: 1px solid #333; border-left: 3px solid var(--new);
    color: var(--text); padding: 12px 16px; border-radius: 12px; z-index: 80;
    width: calc(100% - 32px); max-width: 420px; font-size: 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,.6); transition: transform .35s ease;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.ok { border-left-color: var(--ok); }
  .toast.bad { border-left-color: var(--bad); }

  .loading { text-align: center; color: var(--muted); padding: 40px; }

  @media (min-width: 760px) {
    .row { grid-template-columns: 80px 1fr auto; padding: 16px 18px; }
    .sheet-bg { align-items: center; }
    .sheet { border-radius: 20px; border-bottom: 1px solid var(--border); }
    .req-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  }
  @media (max-width: 380px) {
    .two { grid-template-columns: 1fr; }
    .row { grid-template-columns: 56px 1fr; }
    .row-price { grid-column: 2; }
  }
</style>
</head>

<!-- ===== РЕДАКТОР ===== -->
<div class="sheet-bg hidden" id="sheetBg">
  <form class="sheet" id="editor" novalidate>
    <div class="sheet-head">
      <h3 id="edTitle">Запись</h3>
      <button type="button" class="icon-btn" id="edClose" aria-label="Закрыть">✕</button>
    </div>
    <div class="warn hidden" id="edWarn"></div>
    <div class="two">
      <div class="fld"><label for="edDate">Дата</label><input class="inp" type="date" id="edDate" required></div>
      <div class="fld"><label for="edTime">Время</label><input class="inp" type="time" id="edTime" step="900" required></div>
    </div>
    <div class="fld"><label for="edName">Имя клиента</label><input class="inp" id="edName" maxlength="60" required></div>
    <div class="fld"><label for="edPhone">Телефон</label><input class="inp" id="edPhone" type="tel" inputmode="tel" maxlength="30"></div>
    <div class="contact" id="edContact"></div>
    <div class="two">
      <div class="fld"><label for="edService">Услуга</label><input class="inp" id="edService" list="services" maxlength="60"></div>
      <div class="fld"><label for="edPrice">Цена, ₽</label><input class="inp" id="edPrice" type="number" inputmode="numeric" min="0" step="500"></div>
    </div>
    <datalist id="services">
      <option>Полировка</option><option>Химчистка</option><option>Защитные покрытия</option><option>Комплекс</option>
      <option>Керамическое покрытие</option><option>Антидождь</option><option>Твёрдый воск</option>
      <option>Полировка фар</option><option>Бронирование фар</option><option>Бронирование лобового стекла</option>
    </datalist>
    <div class="fld"><label for="edCar">Автомобиль</label><input class="inp" id="edCar" maxlength="60"></div>
    <div class="fld"><label for="edComment">Комментарий</label><textarea class="inp" id="edComment" maxlength="500" rows="2"></textarea></div>
    <div class="fld"><label>Статус</label>
      <div class="seg" id="edStatus">
        <button type="button" data-s="Новая">Новая</button>
        <button type="button" data-s="Подтверждена">Подтв.</button>
        <button type="button" data-s="Выполнена">Готово</button>
        <button type="button" data-s="Отменена">Отмена</button>
      </div>
    </div>
    <div class="sheet-actions" id="edActions">
      <button class="btn" type="submit" id="edSave">Сохранить</button>
      <button class="btn btn-danger" type="button" id="edDelete">Удалить</button>
    </div>
  </form>
</div>

<script>
  // Адрес веб-приложения (используется, если страница открыта не из Apps Script)
  const API_URL = 'https://script.google.com/macros/s/AKfycbw7e5PhRORfSRErn73_NLDGsyQGWKZafTOJ8mI6YNI9kssyoyNfk63JeNfET-VGmSg/exec';
  const PRICES = { 'Полировка': 20000, 'Химчистка': 15000, 'Защитные покрытия': 10000, 'Керамическое покрытие': 10000,
                   'Антидождь': 5000, 'Твёрдый воск': 5000, 'Полировка фар': 3000, 'Бронирование фар': 3000,
                   'Бронирование лобового стекла': 15000 };
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
  const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const MON_S = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

  const $ = id => document.getElementById(id);
  const S = { key: '', role: '', list: [], tab: 'schedule', day: '', knownNew: null, editing: null, status: 'Подтверждена' };

  // ---------- утилиты ----------
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayIso = () => iso(new Date());
  const money = n => n ? Number(n).toLocaleString('ru-RU') + ' ₽' : '—';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const digits = p => String(p || '').replace(/\D/g, '');
  const telHref = p => { let d = digits(p); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); return d ? 'tel:+' + d : ''; };
  const waHref = p => { let d = digits(p); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); return d.length >= 11 ? 'https://wa.me/' + d : ''; };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  const isOwner = () => S.role === 'owner';
  const stClass = s => ({ 'Новая': 'new', 'Подтверждена': 'ok', 'Выполнена': 'done', 'Отменена': 'bad' }[s] || 'new');
  function dateLabel(s, withWd) {
    if (!s) return '—';
    const d = parse(s);
    return d.getDate() + ' ' + MON[d.getMonth()] + (withWd ? ', ' + WD[d.getDay()] : '');
  }

  // ---------- связь с сервером ----------
  function call(payload) {
    payload = Object.assign({ key: S.key }, payload);
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ type: 'admin' }, payload)) }).then(r => r.json());
  }
  const ERR = {
    auth: 'Неверный код доступа.', locked: 'Слишком много попыток. Подождите 15 минут.',
    nokey: 'Код доступа не настроен: добавьте ADMIN_KEY в свойства скрипта.',
    weakkey: 'Коды доступа слишком короткие или одинаковые: нужно минимум 10 символов, коды владельца и сотрудника — разные.',
    forbidden: 'У вас доступ только для просмотра.', validation: 'Проверьте дату, время и имя.',
    notfound: 'Запись не найдена — обновите список.'
  };
  const errText = r => ERR[r && r.error] || 'Нет связи с сервером. Попробуйте ещё раз.';

  let toastTimer;
  function toast(text, type) {
    const t = $('toast');
    t.textContent = text; t.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast ' + (type || ''), 3800);
  }

  // ---------- вход ----------
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const key = $('loginKey').value.trim();
    if (!key) return;
    $('loginBtn').disabled = true; $('loginErr').textContent = '';
    try {
      S.key = key;
      const r = await call({ action: 'login' });
      if (!r.ok) throw r;
      store.set('arvex_key', key);
      start(r.role);
    } catch (err) { S.key = ''; $('loginErr').textContent = errText(err); }
    $('loginBtn').disabled = false;
  });
  $('logoutBtn').addEventListener('click', () => {
    if (!confirm('Выйти из журнала на этом устройстве?')) return;
    store.set('arvex_key', null); location.reload();
  });

  function start(role) {
    S.role = role;
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('roleLabel').textContent = isOwner() ? 'Владелец' : 'Сотрудник · только просмотр';
    $('addBtn').classList.toggle('hidden', !isOwner());
    bellState();
    S.day = S.day || todayIso();
    renderDays(); load();
    clearInterval(S.timer);
    S.timer = setInterval(() => { if (!document.hidden) load(true); }, 30000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.role) load(true); });

  // ---------- загрузка ----------
  let loading = false;
  async function load(silent) {
    if (loading) return; loading = true;
    try {
      const r = await call({ action: 'list' });
      if (!r.ok) {
        if (r.error === 'auth') { store.set('arvex_key', null); location.reload(); return; }
        throw r;
      }
      const prev = S.loaded ? new Map(S.list.map(b => [b.id, { status: b.status, date: b.date, time: b.time }])) : null;
      S.list = r.bookings || [];
      S.loaded = true;
      if (r.role) S.role = r.role;
      checkNew();
      checkChanges(prev);
      render();
    } catch (err) { if (!silent) toast(errText(err), 'bad'); }
    loading = false;
  }
  $('refreshBtn').addEventListener('click', () => { load(); toast('Обновлено', 'ok'); });

  // ---------- уведомления на телефон ----------
  const canNotify = 'Notification' in window && 'serviceWorker' in navigator && window.isSecureContext;
  function bellState() {
    const btn = $('bellBtn');
    if (!canNotify) { btn.classList.add('hidden'); return; }
    btn.classList.remove('hidden');
    const on = Notification.permission === 'granted' && store.get('arvex_notify') !== 'off';
    btn.textContent = on ? '🔔' : '🔕';
    btn.title = on ? 'Уведомления включены' : 'Включить уведомления';
  }
  $('bellBtn').addEventListener('click', async () => {
    if (Notification.permission === 'denied') {
      toast('Уведомления запрещены в настройках браузера. Разрешите их для этого сайта.', 'bad'); return;
    }
    if (Notification.permission === 'granted' && store.get('arvex_notify') !== 'off') {
      store.set('arvex_notify', 'off'); bellState(); toast('Уведомления выключены'); return;
    }
    const p = await Notification.requestPermission();
    store.set('arvex_notify', null); bellState();
    if (p === 'granted') { toast('Уведомления включены', 'ok'); notify('ARVEX', 'Уведомления о записях включены', 'test'); }
  });
  async function notify(title, body, tag) {
    if (!canNotify || Notification.permission !== 'granted' || store.get('arvex_notify') === 'off') return;
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, { body, tag, renotify: true, icon: 'icon-192.png', badge: 'icon-192.png', vibrate: [120, 60, 120] });
    } catch (e) { try { new Notification(title, { body, icon: 'icon-192.png' }); } catch (e2) {} }
  }

  // изменения, сделанные с других устройств (другой человек записал/перенёс/отменил)
  S.mine = new Set();
  function checkChanges(prev) {
    if (!prev) return;
    S.list.forEach(b => {
      const o = prev.get(b.id);
      if (S.mine.has(b.id) || !o) {
        if (!o && b.status === 'Подтверждена' && !S.mine.has(b.id))
          notify('✅ Клиент записан', b.name + ' · ' + (b.service || '') + ' · ' + dateLabel(b.date) + ' в ' + b.time, 'b' + b.id);
        return;
      }
      if (o.status !== 'Подтверждена' && b.status === 'Подтверждена')
        notify('✅ Клиент записан', b.name + ' · ' + (b.service || '') + ' · ' + dateLabel(b.date) + ' в ' + b.time, 'b' + b.id);
      else if (b.status === 'Подтверждена' && (o.date !== b.date || o.time !== b.time))
        notify('🔁 Запись перенесена', b.name + ' → ' + dateLabel(b.date) + ' в ' + b.time, 'b' + b.id);
      else if (o.status !== 'Отменена' && b.status === 'Отменена')
        notify('❌ Запись отменена', b.name + ' · ' + dateLabel(b.date) + ' в ' + b.time, 'b' + b.id);
    });
    S.mine.clear();
  }

  // новые заявки с сайта → уведомление
  function checkNew() {
    const ids = S.list.filter(b => b.status === 'Новая').map(b => b.id);
    if (S.knownNew) {
      const fresh = S.list.filter(b => b.status === 'Новая' && !S.knownNew.has(b.id));
      if (fresh.length) {
        const b = fresh[0];
        toast('🔔 Новая заявка: ' + b.name + ' — ' + (b.service || 'услуга') + (fresh.length > 1 ? ' (+' + (fresh.length - 1) + ')' : ''));
        fresh.forEach(x => notify('🔔 Новая заявка с сайта', x.name + ' · ' + (x.service || '') + ' · хочет ' + dateLabel(x.date) + ' в ' + (x.time || '—'), 'n' + x.id));
        try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
      }
    }
    S.knownNew = new Set(ids);
    const n = ids.length;
    $('reqBadge').textContent = n; $('reqBadge').classList.toggle('hidden', !n);
    document.title = (n ? '(' + n + ') ' : '') + 'ARVEX · Журнал записей';
  }

  // ---------- вкладки ----------
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    S.tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    $('scheduleView').classList.toggle('hidden', S.tab !== 'schedule');
    $('requestsView').classList.toggle('hidden', S.tab !== 'requests');
    window.scrollTo(0, 0);
  }));

  function render() { renderDays(); renderDay(); renderRequests(); }

  // ---------- лента дней ----------
  function renderDays() {
    const box = $('days');
    const start = new Date(); start.setDate(start.getDate() - 3);
    const counts = {};
    S.list.forEach(b => {
      if (b.status === 'Отменена' || !b.date) return;
      const c = counts[b.date] || (counts[b.date] = { n: 0, fresh: 0 });
      c.n++; if (b.status === 'Новая') c.fresh++;
    });
    let html = '';
    const days = [];
    for (let i = 0; i < 45; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(iso(d)); }
    if (!days.includes(S.day)) days.unshift(S.day);
    const t = todayIso();
    days.forEach(s => {
      const d = parse(s), c = counts[s];
      html += '<button class="day' + (s === t ? ' today' : '') + (s === S.day ? ' active' : '') + '" data-d="' + s + '">' +
        (c ? '<span class="dot' + (c.fresh === c.n ? ' n' : '') + '"></span>' : '') +
        '<small>' + WD[d.getDay()] + '</small><b>' + d.getDate() + '</b><i>' + MON_S[d.getMonth()] + '</i></button>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.day').forEach(b => b.addEventListener('click', () => selectDay(b.dataset.d)));
    const act = box.querySelector('.day.active');
    if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
    $('dayPick').value = S.day;
  }
  function selectDay(d) { S.day = d; renderDays(); renderDay(); }
  $('dayPick').addEventListener('change', e => { if (e.target.value) selectDay(e.target.value); });

  // ---------- расписание дня ----------
  function renderDay() {
    const d = parse(S.day);
    const t = todayIso();
    $('dayTitle').textContent = (S.day === t ? 'Сегодня, ' : '') + d.getDate() + ' ' + MON[d.getMonth()];
    const items = S.list.filter(b => b.date === S.day && b.status !== 'Отменена')
                        .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const confirmed = items.filter(b => b.status !== 'Новая');
    const sum = confirmed.reduce((s, b) => s + (b.price || 0), 0);
    $('daySum').textContent = WD_FULL[d.getDay()] + ' · ' +
      (items.length ? confirmed.length + ' ' + plural(confirmed.length, 'запись', 'записи', 'записей') + (sum ? ' · ' + money(sum) : '') +
        (items.length > confirmed.length ? ' · ждут подтверждения: ' + (items.length - confirmed.length) : '')
      : 'свободный день');
    const box = $('dayList');
    if (!items.length) {
      box.innerHTML = '<div class="empty"><b>Записей нет</b>' + (isOwner() ? 'Нажмите «+», чтобы добавить клиента на этот день.' : '') + '</div>';
      return;
    }
    box.innerHTML = items.map(b => {
      const cls = b.status === 'Новая' ? ' s-new' : b.status === 'Выполнена' ? ' s-done' : '';
      return '<div class="row' + cls + '" role="button" tabindex="0" data-id="' + esc(b.id) + '">' +
        '<div class="row-time">' + esc(b.time || '—') + '<small class="st st-' + stClass(b.status) + '">' + esc(b.status === 'Подтверждена' ? 'подтв.' : b.status) + '</small></div>' +
        '<div class="row-main"><b>' + esc(b.name) + '</b>' +
          '<div class="svc">' + esc(b.service || 'Услуга не указана') + '</div>' +
          (b.car ? '<div class="sub">' + esc(b.car) + '</div>' : '') +
          (b.phone ? '<a class="tel" href="' + telHref(b.phone) + '" onclick="event.stopPropagation()">' + esc(b.phone) + '</a>' : '') +
        '</div>' +
        '<div class="row-price">' + money(b.price) + '</div>' +
      '</div>';
    }).join('');
    box.querySelectorAll('.row').forEach(r => {
      r.addEventListener('click', () => openEditor(byId(r.dataset.id)));
      r.addEventListener('keydown', e => { if (e.key === 'Enter') openEditor(byId(r.dataset.id)); });
    });
  }
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
  const byId = id => S.list.find(b => b.id === id);

  // ---------- заявки ----------
  function renderRequests() {
    const box = $('reqList');
    const items = S.list.filter(b => b.status === 'Новая')
                        .sort((a, b) => (b.received || '').localeCompare(a.received || ''));
    if (!items.length) { box.innerHTML = '<div class="empty"><b>Новых заявок нет</b>Когда клиент запишется на сайте, заявка появится здесь.</div>'; return; }
    box.innerHTML = items.map(b => {
      const rec = b.received ? new Date(b.received) : null;
      const recTxt = rec && !isNaN(rec) ? rec.getDate() + ' ' + MON_S[rec.getMonth()] + ', ' + pad(rec.getHours()) + ':' + pad(rec.getMinutes()) : '';
      const tel = telHref(b.phone), wa = waHref(b.phone);
      return '<div class="req">' +
        '<div class="req-top"><b>' + esc(b.name) + '</b><span>' + esc(recTxt) + (b.source === 'Вручную' ? ' · вручную' : '') + '</span></div>' +
        '<div class="req-when">Хочет: <b>' + esc(dateLabel(b.date, true)) + ' в ' + esc(b.time || '—') + '</b></div>' +
        '<div class="sub">' + esc(b.service || '') + (b.car ? ' · ' + esc(b.car) : '') + (b.price ? ' · ' + money(b.price) : '') + '</div>' +
        '<div class="sub">' + esc(b.phone || '') + '</div>' +
        (b.comment ? '<div class="comment">' + esc(b.comment) + '</div>' : '') +
        '<div class="req-actions">' +
          (tel ? '<a class="btn btn-ghost btn-sm" href="' + tel + '">📞 Позвонить</a>' : '') +
          (wa ? '<a class="btn btn-ghost btn-sm" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
          (isOwner() ? '<button class="btn btn-sm grow" data-act="confirm" data-id="' + esc(b.id) + '">Подтвердить</button>' +
                       '<button class="btn btn-danger btn-sm" data-act="reject" data-id="' + esc(b.id) + '">Отклонить</button>' : '') +
        '</div></div>';
    }).join('');
    box.querySelectorAll('[data-act=confirm]').forEach(x => x.addEventListener('click', () => openEditor(byId(x.dataset.id), 'Подтверждена')));
    box.querySelectorAll('[data-act=reject]').forEach(x => x.addEventListener('click', async () => {
      const b = byId(x.dataset.id);
      if (!b || !confirm('Отклонить заявку ' + b.name + '?')) return;
      await save(Object.assign({}, b, { status: 'Отменена' }), 'Заявка отклонена');
    }));
  }

  // ---------- редактор ----------
  function openEditor(b, presetStatus) {
    const isNew = !b;
    b = b || { date: S.day, time: '', name: '', phone: '', service: '', price: '', car: '', comment: '', status: 'Подтверждена' };
    S.editing = isNew ? null : b.id;
    $('edTitle').textContent = isNew ? 'Новая запись' : presetStatus === 'Подтверждена' ? 'Подтвердить заявку' : 'Запись';
    $('edDate').value = b.date || S.day;
    $('edTime').value = b.time || '';
    $('edName').value = b.name || '';
    $('edPhone').value = b.phone || '';
    $('edService').value = b.service || '';
    $('edPrice').value = b.price || (PRICES[b.service] || '');
    $('edCar').value = b.car || '';
    $('edComment').value = b.comment || '';
    setStatus(presetStatus || b.status || 'Подтверждена');
    const tel = telHref(b.phone), wa = waHref(b.phone);
    $('edContact').innerHTML = (tel ? '<a class="btn btn-ghost btn-sm" href="' + tel + '">📞 Позвонить</a>' : '') +
                               (wa ? '<a class="btn btn-ghost btn-sm" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '');
    $('edDelete').classList.toggle('hidden', isNew || !isOwner());
    $('edActions').classList.toggle('hidden', !isOwner());
    $('editor').querySelectorAll('input, textarea').forEach(i => i.readOnly = !isOwner());
    $('editor').querySelectorAll('.seg button').forEach(x => x.disabled = !isOwner());
    $('edSave').textContent = presetStatus === 'Подтверждена' ? 'Подтвердить запись' : 'Сохранить';
    checkConflict();
    $('sheetBg').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  function closeEditor() { $('sheetBg').classList.add('hidden'); document.body.style.overflow = ''; }
  $('edClose').addEventListener('click', closeEditor);
  $('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeEditor(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditor(); });

  function setStatus(s) {
    S.status = s;
    $('edStatus').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  }
  $('edStatus').addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) { setStatus(b.dataset.s); checkConflict(); } });
  $('edService').addEventListener('change', () => { if (!$('edPrice').value && PRICES[$('edService').value]) $('edPrice').value = PRICES[$('edService').value]; });
  ['edDate', 'edTime'].forEach(id => $(id).addEventListener('change', checkConflict));

  function conflicts() {
    const d = $('edDate').value, t = $('edTime').value;
    if (!d || !t || S.status === 'Отменена') return [];
    return S.list.filter(b => b.id !== S.editing && b.date === d && b.time === t && (b.status === 'Подтверждена' || b.status === 'Выполнена'));
  }
  function checkConflict() {
    const c = conflicts();
    $('edWarn').classList.toggle('hidden', !c.length);
    if (c.length) $('edWarn').textContent = '⚠ На ' + dateLabel($('edDate').value) + ' в ' + $('edTime').value + ' уже записан: ' + c.map(b => b.name).join(', ');
  }

  $('editor').addEventListener('submit', async e => {
    e.preventDefault();
    if (!isOwner()) return;
    const b = {
      id: S.editing || '',
      date: $('edDate').value, time: $('edTime').value,
      name: $('edName').value.trim(), phone: $('edPhone').value.trim(),
      service: $('edService').value.trim(), price: Number($('edPrice').value) || 0,
      car: $('edCar').value.trim(), comment: $('edComment').value.trim(),
      status: S.status
    };
    if (!b.date || !b.time || !b.name) { toast('Укажите дату, время и имя клиента', 'bad'); return; }
    if (conflicts().length && !confirm('Это время уже занято. Всё равно сохранить?')) return;
    const ok = await save(b, S.editing ? 'Запись обновлена' : 'Клиент записан');
    if (ok) { closeEditor(); if (b.status !== 'Отменена') { S.day = b.date; renderDays(); renderDay(); } }
  });
  $('edDelete').addEventListener('click', async () => {
    const b = byId(S.editing);
    if (!b || !confirm('Удалить запись ' + b.name + ' насовсем? Лучше поставить статус «Отмена», чтобы она осталась в истории.')) return;
    $('edDelete').disabled = true;
    try {
      const r = await call({ action: 'delete', id: b.id });
      if (!r.ok) throw r;
      S.list = S.list.filter(x => x.id !== b.id);
      closeEditor(); render(); toast('Запись удалена', 'ok');
    } catch (err) { toast(errText(err), 'bad'); }
    $('edDelete').disabled = false;
  });

  async function save(b, okText) {
    $('edSave').disabled = true;
    try {
      const r = await call({ action: 'save', booking: b });
      if (!r.ok) throw r;
      b.id = r.id;
      S.mine.add(b.id);
      const i = S.list.findIndex(x => x.id === b.id);
      if (i >= 0) S.list[i] = Object.assign({}, S.list[i], b);
      else S.list.push(Object.assign({ received: new Date().toISOString(), source: 'Вручную' }, b));
      checkNew(); render(); toast(okText, 'ok');
      return true;
    } catch (err) { toast(errText(err), 'bad'); return false; }
    finally { $('edSave').disabled = false; }
  }

  $('addBtn').addEventListener('click', () => openEditor(null));

  // ---------- установка как приложение ----------
  if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // ---------- автологин ----------
  (async function () {
    const saved = store.get('arvex_key');
    if (!saved) { $('loginKey').focus(); return; }
    S.key = saved;
    try {
      const r = await call({ action: 'login' });
      if (r.ok) { start(r.role); return; }
      store.set('arvex_key', null);
    } catch (e) {}
    S.key = '';
  })();
</script>
</body>
</html>
